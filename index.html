
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primer sitio en Render</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #172554, #2563eb);
    }

    main {
      width: min(85%, 600px);
      padding: 40px 24px;
      text-align: center;
      border: 1px solid #ffffff55;
      border-radius: 20px;
      background: #ffffff12;
      box-sizing: border-box;
    }

    h1 { font-size: 2.2rem; }
    p { line-height: 1.7; }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #ffffff20;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">Mi primera práctica en la nube</span>
    <h1>¡Hola, mundo!</h1>
    <p>Esta página está almacenada en GitHub
       y será publicada mediante Render.</p>
    <p>Aprendiendo a desplegar aplicaciones web.</p>
  </main>
</body>
</html>
